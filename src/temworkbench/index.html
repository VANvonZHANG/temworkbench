<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEM Workbench</title>
<style>
:root { color-scheme: dark; font: 15px system-ui, sans-serif; color: #e6e9f0; background: #11151c; }
body { margin: 0 auto; padding: clamp(16px, 4vw, 48px); max-width: 1040px; }
header, form, .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
header { justify-content: space-between; margin-bottom: 16px; }
h1 { margin: 0; font-size: 1.7rem; }
h2 { margin: 0 0 14px; font-size: 1.05rem; }
p { margin: .7rem 0; }
label { display: grid; gap: 5px; }
input, select, button { font: inherit; border: 1px solid #536175; border-radius: 6px; padding: 8px 10px; }
input, select { background: #161d27; color: inherit; }
button { cursor: pointer; background: #263344; color: inherit; }
button:hover:enabled { filter: brightness(1.18); }
button:disabled { opacity: .55; cursor: default; }
button.primary { background: #9de4df; color: #0e2527; border-color: #9de4df; font-weight: 650; }
button.stop { border-color: #bf7272; color: #ffc6c6; }
#workspace:not([hidden]) { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 14px; }
section { border: 1px solid #354152; border-radius: 10px; background: #191f29; padding: 16px; min-width: 0; }
figure { margin: 0 0 14px; aspect-ratio: 1; background: #0a0d11; border-radius: 5px; display: grid; place-items: center; overflow: hidden; }
figure img { width: 100%; height: 100%; object-fit: contain; }
aside { display: grid; align-content: start; gap: 14px; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0; }
dt, .muted { color: #aab7ca; }
dd { margin: 0; font-variant-numeric: tabular-nums; }
#pending > div { border-top: 1px solid #354152; padding: 10px 0; overflow-wrap: anywhere; }
#message { min-height: 1.4em; color: #ffc6c6; }
#job { overflow-wrap: anywhere; margin: 10px 0 0; }
@media (max-width: 740px) { #workspace:not([hidden]) { grid-template-columns: 1fr; } }
</style>
<header>
  <h1>TEM Workbench <small class="muted">模拟器</small></h1>
  <button id="stop" class="stop" hidden>停止并遮挡束斑</button>
</header>
<form id="login">
  <label>操作员令牌 <input id="token" type="password" required autocomplete="off"></label>
  <label>会话 <input id="session" value="local" required pattern="[a-z0-9][a-z0-9_\-]{0,63}"></label>
  <button class="primary">连接</button>
</form>
<p id="message" role="status"></p>
<main id="workspace" hidden>
  <section>
    <h2>相机预览</h2>
    <figure><img id="image" alt="模拟相机画面" hidden><span id="blank" class="muted">预览已暂停</span></figure>
    <form id="camera">
      <label>曝光（秒） <input id="exposure" type="number" min="0.01" max="2" step="any" value="0.1" required></label>
      <label>Binning
        <select id="binning"><option>1</option><option>2</option><option>4</option></select>
      </label>
      <button id="live" type="button">开始预览</button>
      <button id="capture" class="primary">取图保存</button>
    </form>
    <p id="job" role="status"></p>
    <div id="downloads" class="actions"></div>
  </section>
  <aside>
    <section><h2>镜体状态</h2><dl id="state"></dl></section>
    <section><h2>操作审批</h2><div id="pending"><p class="muted">暂无待审批操作</p></div></section>
  </aside>
</main>
<script>
const element = id => document.getElementById(id);
const message = element("message");
const camera = element("camera");
const modes = {
  acquire_image: "采集", set_magnification: "设置放大倍数",
  set_brightness: "设置亮度", set_defocus: "设置离焦",
  move_stage: "移动样品台",
};
let authorization, session, socket, previewTimer, previewUrl;
let stopped = false;
const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

async function api(path, options = {}, read = response => response.json()) {
  const response = await fetch(path, {
    ...options,
    headers: {Authorization: authorization, "Content-Type": "application/json"},
  });
  if (!response.ok) {
    const body = await response.json().catch(() => ({}));
    throw new Error(typeof body.detail === "string" ? body.detail : `请求失败（${response.status}）`);
  }
  return read(response);
}

function exposure() {
  return {exposure_s: Number(element("exposure").value), binning: Number(element("binning").value)};
}

function showState({device, stopped: halted, device_connected: connected}) {
  const rows = [
    ["连接", connected ? "模拟器在线" : "模拟器离线"], ["模式", device.mode],
    ["加速电压", `${device.beam_energy_kev} kV`], ["放大倍数", `${device.magnification}×`],
    ["亮度", device.brightness], ["离焦（模拟器刻度）", device.defocus_ticks],
    ["样品台（nm）", `${device.stage.x_nm}, ${device.stage.y_nm}, ${device.stage_z_nm}`],
    ["束斑（空闲状态）", device.beam_blanked ? "遮挡" : "开放"],
  ];
  element("state").replaceChildren(...rows.flatMap(([label, value]) => {
    const dt = document.createElement("dt");
    const dd = document.createElement("dd");
    dt.textContent = label;
    dd.textContent = value;
    return [dt, dd];
  }));
  stopped = halted;
  if (halted) pausePreview();
  element("stop").disabled = halted;
  element("live").disabled = halted || !connected;
  element("capture").disabled = halted || !connected || element("capture").dataset.busy === "true";
}

function showApprovals(jobs) {
  const pending = element("pending");
  if (!jobs.length) {
    const empty = document.createElement("p");
    empty.className = "muted";
    empty.textContent = "暂无待审批操作";
    pending.replaceChildren(empty);
    return;
  }
  pending.replaceChildren(...jobs.map(job => {
    const item = document.createElement("div");
    const line = document.createElement("p");
    const {kind, ...parameters} = job.command;
    line.textContent = `${job.session_id} · ${modes[kind]} · ${JSON.stringify(parameters)}`;
    const controls = document.createElement("div");
    controls.className = "actions";
    for (const [label, allow] of [["批准", true], ["拒绝", false]]) {
      const button = document.createElement("button");
      button.textContent = label;
      button.onclick = async () => {
        button.disabled = true;
        try {
          const result = await api(
            `/api/operator/approvals/${job.session_id}/${job.command_id}?allow=${allow}`, {method: "POST"},
          );
          if (result.error) message.textContent = result.error;
          await refresh();
        } catch (error) {
          message.textContent = error.message;
        } finally {
          button.disabled = false;
        }
      };
      controls.append(button);
    }
    item.append(line, controls);
    return item;
  }));
}

async function refresh() {
  showState(await api(`/api/state?session_id=${encodeURIComponent(session)}`));
  if (!document.hidden) showApprovals(await api("/api/operator/approvals"));
}

element("login").onsubmit = async event => {
  event.preventDefault();
  authorization = `Bearer ${element("token").value.trim()}`;
  session = element("session").value;
  try {
    await refresh();
    message.textContent = "";
    element("token").value = "";
    element("login").hidden = true;
    element("login").style.display = "none";
    element("workspace").hidden = false;
    element("stop").hidden = false;
    const poll = async () => {
      try { if (!document.hidden) await refresh(); }
      catch (error) { message.textContent = error.message; }
      setTimeout(poll, 2000);
    };
    setTimeout(poll, 2000);
  } catch (error) {
    message.textContent = error.message;
  }
};

function pausePreview() {
  clearTimeout(previewTimer);
  if (socket) {
    socket.onclose = null;
    socket.close();
    socket = undefined;
  }
  element("live").textContent = "开始预览";
}
element("live").onclick = () => {
  if (socket) return pausePreview();
  if (!camera.reportValidity()) return;
  const address = new URL("/api/preview", window.location.href);
  address.protocol = address.protocol === "https:" ? "wss:" : "ws:";
  const connection = new WebSocket(address);
  socket = connection;
  connection.binaryType = "blob";
  element("live").textContent = "暂停预览";
  function requestFrame() {
    if (socket !== connection || connection.readyState !== WebSocket.OPEN) return;
    if (document.hidden || !camera.checkValidity()) {
      previewTimer = setTimeout(requestFrame, 300);
      return;
    }
    connection.send(JSON.stringify(exposure()));
  }
  connection.onopen = () => { connection.send(authorization); requestFrame(); };
  connection.onmessage = event => {
    if (socket !== connection) return;
    if (typeof event.data === "string") message.textContent = JSON.parse(event.data).error;
    else {
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(event.data);
      element("image").src = previewUrl;
      element("image").hidden = false;
      element("blank").hidden = true;
    }
    previewTimer = setTimeout(requestFrame, 250);
  };
  connection.onclose = () => { message.textContent = "预览连接已关闭"; pausePreview(); };
};
document.addEventListener("visibilitychange", () => {
  if (document.hidden) pausePreview();
});

async function download(path, name) {
  const blob = await api(path, {}, response => response.blob());
  const url = URL.createObjectURL(blob);
  const link = Object.assign(document.createElement("a"), {href: url, download: name});
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

camera.onsubmit = async event => {
  event.preventDefault();
  const button = element("capture");
  const label = element("job");
  const downloads = element("downloads");
  button.disabled = true;
  button.dataset.busy = "true";
  message.textContent = "";
  label.textContent = "正在提交采集…";
  downloads.replaceChildren();
  const commandId = crypto.randomUUID();
  try {
    const body = JSON.stringify({
      session_id: session, command_id: commandId,
      command: {kind: "acquire_image", ...exposure()},
    });
    let result;
    try { result = await api("/api/commands", {method: "POST", body}); }
    catch (error) {
      if (!(error instanceof TypeError)) throw error;
      result = await api("/api/commands", {method: "POST", body});
    }
    const path = `/api/jobs/${session}/${commandId}`;
    while (["queued", "running"].includes(result.status)) {
      label.textContent = result.status === "queued" ? "等待采集…" : "正在采集和保存…";
      await delay(400);
      result = await api(path);
    }
    if (result.status !== "succeeded") throw new Error(result.error || result.status);
    label.textContent = `已保存 · ${commandId}`;
    for (const format of ["hspy", "tiff"]) {
      const link = document.createElement("button");
      link.textContent = `下载 ${format.toUpperCase()}`;
      link.onclick = () => download(`${path}/files/${format}`, `${commandId}.${format}`)
        .catch(error => { message.textContent = error.message; });
      downloads.append(link);
    }
  } catch (error) {
    label.textContent = `采集未完成 · ${commandId}`;
    message.textContent = error.message;
  } finally {
    button.dataset.busy = "false";
    button.disabled = stopped;
  }
};
element("stop").onclick = async () => {
  try {
    pausePreview();
    await api("/api/operator/stop", {method: "POST"});
    await refresh();
    message.textContent = "已停止。重启服务后可重新采集。";
  } catch (error) {
    message.textContent = error.message;
  }
};
</script>
</html>
